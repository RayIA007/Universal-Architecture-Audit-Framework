name: UAAF CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uaaf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python 3.14.6
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          architecture: x64

      - name: Validate environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3

      - name: Run complete test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Validate CLI help
        shell: pwsh
        run: python run.py --help

      - name: Run controlled CLI smoke test
        shell: pwsh
        run: |
          $smokeOutput = Join-Path $env:RUNNER_TEMP "uaaf-smoke-reports"
          if (Test-Path -LiteralPath $smokeOutput) {
              Remove-Item -LiteralPath $smokeOutput -Recurse -Force
          }
          New-Item -ItemType Directory -Path $smokeOutput | Out-Null

          python run.py `
              --project-path "12_EXAMPLES/sample_project" `
              --auditors "configuration" `
              --output-formats "markdown,json,sarif" `
              --output-dir $smokeOutput

          if ($LASTEXITCODE -ne 0) {
              throw "UAAF CLI smoke test failed with exit code $LASTEXITCODE."
          }

          $markdownReports = @(
              Get-ChildItem -LiteralPath $smokeOutput -Filter "*.md" -File
          )
          $jsonReports = @(
              Get-ChildItem -LiteralPath $smokeOutput -Filter "*.json" -File
          )
          $sarifReports = @(
              Get-ChildItem -LiteralPath $smokeOutput -Filter "*.sarif" -File
          )

          if ($markdownReports.Count -lt 1) {
              throw "The CLI smoke test did not create a Markdown report."
          }
          if ($jsonReports.Count -lt 1) {
              throw "The CLI smoke test did not create a JSON report."
          }
          if ($sarifReports.Count -ne 1) {
              throw "The CLI smoke test must create exactly one SARIF report."
          }

          $sarifPath = $sarifReports[0].FullName
          $sarifText = Get-Content -LiteralPath $sarifPath -Raw -Encoding UTF8
          $sarifDocument = $sarifText | ConvertFrom-Json
          if ($sarifDocument.version -ne "2.1.0") {
              throw "The SARIF smoke report does not declare version 2.1.0."
          }
          if ($null -eq $sarifDocument.runs -or $sarifDocument.runs.Count -ne 1) {
              throw "The SARIF smoke report must contain exactly one run."
          }
          if ($sarifText -match '(?i)\b[A-Z]:[\\/]') {
              throw "The SARIF smoke report contains an absolute Windows path."
          }

          "UAAF_SARIF_PATH=$sarifPath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "CLI smoke test created Markdown, JSON, and SARIF reports."

      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.UAAF_SARIF_PATH }}
          category: uaaf
